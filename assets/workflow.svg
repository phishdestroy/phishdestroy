<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Scan, archive, report, follow up — the work we can do ourselves">
    <title>Scan, archive, report, follow up — the work we can do ourselves</title>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset=".6" stop-color="#0b1017"/><stop offset="1" stop-color="#180e16"/></linearGradient>
      <linearGradient id="line"><stop stop-color="#ff4e61"/><stop offset=".6" stop-color="#ff4e61" stop-opacity=".15"/><stop offset="1" stop-color="#ff4e61" stop-opacity="0"/></linearGradient>
      <radialGradient id="fade"><stop offset=".58" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
      <mask id="logo-fade"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    </defs>
    <g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="1198" height="128" rx="14" fill="#101720" stroke="#283341"/><text x="34" y="57" fill="#f0f5fc" font-size="40" font-weight="650" letter-spacing="-1">Scan</text><text x="34" y="92" fill="#93a2b5" font-size="17">Observe what is there</text><text x="334" y="57" fill="#f0f5fc" font-size="40" font-weight="650" letter-spacing="-1">Archive</text><text x="334" y="92" fill="#93a2b5" font-size="17">Preserve the evidence</text><text x="634" y="57" fill="#f0f5fc" font-size="40" font-weight="650" letter-spacing="-1">Report</text><text x="634" y="92" fill="#93a2b5" font-size="17">Notify the right providers</text><text x="934" y="57" fill="#f0f5fc" font-size="40" font-weight="650" letter-spacing="-1">Follow up</text><text x="934" y="92" fill="#93a2b5" font-size="17">Record what happens</text></g></svg>