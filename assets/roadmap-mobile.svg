<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-label="Running: collect domains, publish feeds, scan, archive, report and follow up. Growing: IOCs, fingerprints and scam patterns. Underway: Gemini has used our findings; API and MCP provide live checks.">
    <title>Running: collect domains, publish feeds, scan, archive, report and follow up. Growing: IOCs, fingerprints and scam patterns. Underway: Gemini has used our findings; API and MCP provide live checks.</title>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset=".6" stop-color="#0b1017"/><stop offset="1" stop-color="#180e16"/></linearGradient>
      <linearGradient id="line"><stop stop-color="#ff4e61"/><stop offset=".6" stop-color="#ff4e61" stop-opacity=".15"/><stop offset="1" stop-color="#ff4e61" stop-opacity="0"/></linearGradient>
      <radialGradient id="fade"><stop offset=".58" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
      <mask id="logo-fade"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    </defs>
    <g font-family="Segoe UI, Arial, sans-serif"><g transform="translate(0 0)">
          <rect x="1" y="1" width="638" height="198" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H613" stroke="#66d5e9" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="40" fill="#66d5e9" font-size="18" font-weight="600" letter-spacing="1.6">01 / RUNNING</text>
          <circle cx="610" cy="34" r="4" fill="#66d5e9">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="0s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="91" fill="#f0f5fc" font-size="34" font-weight="650" letter-spacing="-.6">Find. Publish. Report.</text><text x="26" y="136" fill="#a9b7c9" font-size="25">Collect and verify domains.</text><text x="26" y="168" fill="#a9b7c9" font-size="25">Publish feeds. Report abuse.</text></g><path d="M320 201V219" stroke="#39485b" stroke-width="2"/><g transform="translate(0 220)">
          <rect x="1" y="1" width="638" height="198" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H613" stroke="#b1a0ff" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="40" fill="#b1a0ff" font-size="18" font-weight="600" letter-spacing="1.6">02 / GROWING</text>
          <circle cx="610" cy="34" r="4" fill="#b1a0ff">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="1s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="91" fill="#f0f5fc" font-size="34" font-weight="650" letter-spacing="-.6">Keep the proof.</text><text x="26" y="136" fill="#a9b7c9" font-size="25">IOCs, fingerprints and scam patterns.</text><text x="26" y="168" fill="#a9b7c9" font-size="25">Keep digging when a site stays up.</text></g><path d="M320 421V439" stroke="#39485b" stroke-width="2"/><g transform="translate(0 440)">
          <rect x="1" y="1" width="638" height="198" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H613" stroke="#ff697a" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="40" fill="#ff697a" font-size="18" font-weight="600" letter-spacing="1.6">03 / UNDERWAY</text>
          <circle cx="610" cy="34" r="4" fill="#ff697a">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="2s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="91" fill="#f0f5fc" font-size="34" font-weight="650" letter-spacing="-.6">Put evidence to work.</text><text x="26" y="136" fill="#a9b7c9" font-size="25">Gemini has used our findings.</text><text x="26" y="168" fill="#a9b7c9" font-size="25">API + MCP provide live checks.</text></g></g></svg>