<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Running: collect domains, publish feeds, scan, archive, report and follow up. Growing: IOCs, fingerprints and scam patterns. Underway: Gemini has used our findings; API and MCP provide live checks.">
    <title>Running: collect domains, publish feeds, scan, archive, report and follow up. Growing: IOCs, fingerprints and scam patterns. Underway: Gemini has used our findings; API and MCP provide live checks.</title>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101720"/><stop offset=".6" stop-color="#0b1017"/><stop offset="1" stop-color="#180e16"/></linearGradient>
      <linearGradient id="line"><stop stop-color="#ff4e61"/><stop offset=".6" stop-color="#ff4e61" stop-opacity=".15"/><stop offset="1" stop-color="#ff4e61" stop-opacity="0"/></linearGradient>
      <radialGradient id="fade"><stop offset=".58" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
      <mask id="logo-fade"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    </defs>
    <g font-family="Segoe UI, Arial, sans-serif"><g transform="translate(0 0)">
          <rect x="1" y="1" width="382" height="218" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H357" stroke="#66d5e9" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="42" fill="#66d5e9" font-size="13" font-weight="600" letter-spacing="1.6">01 / RUNNING</text>
          <circle cx="354" cy="37" r="4" fill="#66d5e9">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="0s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="97" fill="#f0f5fc" font-size="27" font-weight="650" letter-spacing="-.6">Find. Publish. Report.</text><text x="26" y="145" fill="#a9b7c9" font-size="17">Collect and verify domains.</text><text x="26" y="172" fill="#a9b7c9" font-size="17">Publish feeds. Report abuse.</text></g><path d="M385 110H407" stroke="#39485b" stroke-width="2"/><g transform="translate(408 0)">
          <rect x="1" y="1" width="382" height="218" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H357" stroke="#b1a0ff" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="42" fill="#b1a0ff" font-size="13" font-weight="600" letter-spacing="1.6">02 / GROWING</text>
          <circle cx="354" cy="37" r="4" fill="#b1a0ff">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="1s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="97" fill="#f0f5fc" font-size="27" font-weight="650" letter-spacing="-.6">Keep the proof.</text><text x="26" y="145" fill="#a9b7c9" font-size="17">IOCs, fingerprints and scam patterns.</text><text x="26" y="172" fill="#a9b7c9" font-size="17">Keep digging when a site stays up.</text></g><path d="M793 110H815" stroke="#39485b" stroke-width="2"/><g transform="translate(816 0)">
          <rect x="1" y="1" width="382" height="218" rx="14" fill="#101720" stroke="#283341"/>
          <path d="M27 1H357" stroke="#ff697a" stroke-opacity=".7" stroke-width="2"/>
          <text x="26" y="42" fill="#ff697a" font-size="13" font-weight="600" letter-spacing="1.6">03 / UNDERWAY</text>
          <circle cx="354" cy="37" r="4" fill="#ff697a">
            <animate attributeName="opacity" values=".3;1;.3" dur="4s" begin="2s" repeatCount="indefinite"/>
          </circle>
          <text x="26" y="97" fill="#f0f5fc" font-size="27" font-weight="650" letter-spacing="-.6">Put evidence to work.</text><text x="26" y="145" fill="#a9b7c9" font-size="17">Gemini has used our findings.</text><text x="26" y="172" fill="#a9b7c9" font-size="17">API + MCP provide live checks.</text></g></g></svg>